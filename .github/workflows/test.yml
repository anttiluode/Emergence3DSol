name: Vine support tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pytest
      - name: Compile source
        run: python -m compileall -q emergence3d run.py experiment.py
      - name: Validate support ecology
        run: python -m pytest -q tests
      - name: Run all four experiment arms (short smoke)
        run: |
          python experiment.py --seeds 0 --steps 4 --log-every 2 --size 12 --depth 8 --seed-cells 24 --rods 2 --device cpu --out /tmp/vine-smoke
          python -c "import csv; rows=list(csv.DictReader(open('/tmp/vine-smoke/summary.csv'))); assert len(rows) == 4, len(rows)"
